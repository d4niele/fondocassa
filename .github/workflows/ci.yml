name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: App Android (test, lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Test unitari, lint e APK di debug
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Report dei test e del lint
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report-android
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: APK di debug
        uses: actions/upload-artifact@v7
        with:
          name: fondocassa-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  apps-script:
    name: Apps Script (test)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Test dello script
        run: node --test apps-script/test/*.test.js
