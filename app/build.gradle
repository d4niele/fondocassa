plugins {
    id 'com.android.application'
}

// Versione: sovrascrivibile dalla CI con -PappVersionName=1.2.3 -PappVersionCode=10203
def appVersionName = providers.gradleProperty('appVersionName').getOrElse('0.1.0-dev')
def appVersionCode = providers.gradleProperty('appVersionCode').getOrElse('1') as Integer

// Firma release: letta da variabili d'ambiente (impostate dal workflow di release).
def keystorePath = System.getenv('FONDOCASSA_KEYSTORE_FILE')
def hasSigning = keystorePath != null && !keystorePath.isEmpty() && file(keystorePath).exists()

android {
    namespace 'it.fondocassa'
    compileSdk 36

    defaultConfig {
        applicationId 'it.fondocassa'
        minSdk 26
        targetSdk 36
        versionCode appVersionCode
        versionName appVersionName
    }

    signingConfigs {
        if (hasSigning) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv('FONDOCASSA_KEYSTORE_PASSWORD')
                keyAlias System.getenv('FONDOCASSA_KEY_ALIAS')
                keyPassword System.getenv('FONDOCASSA_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    lint {
        abortOnError true
        warningsAsErrors false
        checkReleaseBuilds false
    }
}

dependencies {
    def roomVersion = '2.8.5'

    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.fragment:fragment:1.9.1'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.11.0'
    implementation 'androidx.work:work-runtime:2.12.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation "androidx.room:room-runtime:$roomVersion"
    annotationProcessor "androidx.room:room-compiler:$roomVersion"
    implementation 'com.google.code.gson:gson:2.15.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.18'
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation 'androidx.test.ext:junit:1.3.0'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    testImplementation 'androidx.work:work-testing:2.12.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
